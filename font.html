<html>
<head>
<meta charset="utf-8">
<style>
canvas, table, td {border: 1px solid black; border-collapse: collapse;}
td {height: 10px; width: 8px}
</style>
</head>
<canvas id="canvas" width="384" height="512"></canvas>
<div>
<table id="character"></table>
<span id="character_index">0x0</span>
<button onclick="showCharacter(index-1);">Prev</button><button onclick="showCharacter(index+1);">Next</button>
<input size="1" type="text" id="character_width" value="5" title="Character Width" onchange="createCharacter(); getCharacterValue()">
<button onclick="clearCharacter();">Clear</Button>
<br><span id="character_value"></span>
</div>
<script src="tokens.js"></script>
<script src="font.js"></script>
<script>
var canvas = getEl("canvas");
var ctx = canvas.getContext("2d");
var character = getEl("character");
var index = 0x41;
createCharacter();
showCharacter(index);

for (var i=0; i<16; i++) {
    for (var j=0; j<16; j++) {
        printCharacter(font[i*16+j], j*6, i*8);
    }
}
function createCharacter() {
    character.innerHTML = "";
    for (var i=0; i<7; i++) {
        var tr = document.createElement("tr")
        for (var j=0; j<getEl("character_width").value; j++) {
            var td = document.createElement("td")
            td.setAttribute("onclick", "this.style.backgroundColor = this.style.backgroundColor == 'black' ? 'white' : 'black'; getCharacterValue();");
            tr.appendChild(td);
        }
        character.appendChild(tr);
    }
}
function showCharacter(i) {
    if (i>=0&&i<font.length) index=i;
    var tds = character.getElementsByTagName("td");
    for (var i=0; i<font[index].length; i++) {
        for (var j=0; j<7; j++) {
            tds[j*font[index].length+i].style.backgroundColor = font[index][i]&(2**j)? "black" : "white";
        }
    }
    getEl("character_index").innerText = "0x"+index.toString(16);
    getCharacterValue();
}
function clearCharacter() {
    var tds = character.getElementsByTagName("td");
    for (var i=0; i<tds.length; i++) tds[i].style.backgroundColor = "white";
    getCharacterValue();
}
function getCharacterValue() {
    getEl("character_value").innerText = "[";
    var tds = character.getElementsByTagName("td");
    var value=0;
    for (var i=0; i<getEl("character_width").value; i++) {
        for (var j=0; j<7; j++) {
           value += tds[i+j*getEl("character_width").value].style.backgroundColor == "black" ? 2**j : 0;
        }
        getEl("character_value").innerText += "0x"+value.toString(16) + ", ";
        value = 0;
    }
    getEl("character_value").innerText += "]";
}
function setPixel(x, y, value) {
    value = value == 0 ? 255 : 0;
    if (value==0) ctx.fillRect(x*4, y*4, 4, 4);
}
function printCharacter(c, x, y) {
    for (var i=0; i<c.length; i++) {
        for (var j=0; j<7; j++) {
            setPixel(x+i, y+j, c[i]&(2**j));
        }
    }
}
function getEl(id) {return document.getElementById(id);}
</script>
</body>
</html>
